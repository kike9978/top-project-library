<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Oding Project | Book library</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="reset.css">
</head>

<body>
  <h1 class="text-3xl">The Odin Project Book library</h1>
  <button id="open-modal-btn" class="rounded bg-pink-400 text-white py-2 px-4 hover:bg-pink-500">Agregar libro</button>
  <dialog>
    <form action="" class="flex flex-col gap-8 p-8">
      <h3>Agregar nuevo libro</h3>
      <label class="gap-2 flex flex-col">
        Título
        <input class="px-2 h-10 border border-solid border-slate-300" type="text" id="title" name="title" required>
      </label>
      <label class="gap-2 flex flex-col">
        Autor
        <input class="px-2 h-10 border border-solid border-slate-300" type="text" id="author" name="author" required>
      </label>
      <label class="gap-2 flex flex-col">
        Páginas
        <input class="px-2 h-10 border border-solid border-slate-300" type="number" id="pages" name="pages" required>
      </label>
      <label class="flex gap-2">
        <input class="" type="checkbox" id="isRead" name="isRead">
        Leído
      </label>
      <menu class="flex flex-end gap-2">
        <button id="close-modal-btn" type="button">Cancelar</button>
        <button class="rounded bg-pink-400 text-white py-2 px-4 hover:bg-pink-500" type="submit"
          id="add-book-btn">Añadir</button>
        <button id="save-book-btn" class="display-none">Guardar</button>
      </menu>
    </form>
  </dialog>
  <section class="card-grid"></section>
</body>

</html>
